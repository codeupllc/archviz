name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm -r run build
      - run: pnpm -r run test
      - run: pnpm -r run typecheck

  terraform-validate:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: pnpm install
      - run: pnpm --filter @archviz/schema build
      - run: pnpm --filter @archviz/core build
      - run: pnpm --filter @archviz/provider-aws build
      - run: pnpm --filter @archviz/codegen build
      - name: Generate fixture and validate
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { createEmptyDocument } from '@archviz/core';
          import { createAwsRegistry } from '@archviz/provider-aws';
          import { generateMainTf } from '@archviz/codegen';

          const registry = createAwsRegistry();
          const doc = {
            ...createEmptyDocument('ci'),
            resources: [
              {
                id: 'vpc-1',
                type: 'aws/vpc',
                name: 'main',
                properties: { cidr_block: '10.0.0.0/16', enable_dns_hostnames: true, enable_dns_support: true },
                parentId: null,
                layout: { x: 0, y: 0 },
              },
              {
                id: 'subnet-1',
                type: 'aws/subnet',
                name: 'public',
                properties: { cidr_block: '10.0.1.0/24', map_public_ip_on_launch: true },
                parentId: 'vpc-1',
                layout: { x: 0, y: 0 },
              },
              {
                id: 'ec2-1',
                type: 'aws/ec2-instance',
                name: 'web',
                properties: { ami: 'ami-0c55b159cbfafe1f0', instance_type: 't3.micro' },
                parentId: 'subnet-1',
                layout: { x: 0, y: 0 },
              },
            ],
            relationships: [],
          };
          mkdirSync('tmp/tf-fixture', { recursive: true });
          writeFileSync('tmp/tf-fixture/main.tf', generateMainTf(doc, registry));
          EOF
      - name: terraform fmt -check
        working-directory: tmp/tf-fixture
        run: terraform fmt -check -diff || terraform fmt -diff
      - name: terraform init + validate
        working-directory: tmp/tf-fixture
        run: |
          terraform init -backend=false
          terraform validate
