name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm -r run build
      - run: pnpm -r run test
      - run: pnpm -r run typecheck

  terraform-validate:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: pnpm install
      - run: pnpm --filter @archviz/schema build
      - run: pnpm --filter @archviz/core build
      - run: pnpm --filter @archviz/provider-aws build
      - run: pnpm --filter @archviz/codegen build
      # Generates a diagram using every resource type we ship and asserts the
      # HCL is accepted by terraform validate + fmt, so a resource definition
      # can never silently omit an argument Terraform requires.
      - name: Generate all-resources fixture, terraform validate + fmt
        run: node scripts/validate-fixture.mjs tmp/tf-fixture
